<style>

.tabs{display:flex;gap:8px;width:100%}
.tabs button{flex:1;font:inherit;font-size:15px;padding:9px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--fg);cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel input{flex:1 1 200px;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--fg)}
#dl{font:inherit;font-size:15px;padding:10px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
#wa{font:inherit;font-size:15px;padding:10px 16px;border-radius:10px;border:0;background:#1fa855;color:#fff;cursor:pointer}
.card{position:relative;width:100%;max-width:560px;container-type:inline-size;line-height:0;border-radius:6px;overflow:hidden}
.card img{width:100%;height:auto;display:block}
#nm{position:absolute;top:26.6%;height:2.9%;display:flex;align-items:flex-end;justify-content:flex-start;direction:rtl;color:#fff;font-weight:700;font-size:2.7cqw;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

var CFG={ku:{right:13.6,width:46,x:964},ar:{right:16.0,width:46,x:938}};
var cur='ku',inp=document.getElementById('in'),nm=document.getElementById('nm'),bg=document.getElementById('bg');
function apply(){var c=CFG[cur];nm.style.right=c.right+'%';nm.style.width=c.width+'%';}
function setLang(l){cur=l;bg.src=IMG[l];apply();
  document.getElementById('t-ku').className=l==='ku'?'on':'';
  document.getElementById('t-ar').className=l==='ar'?'on':'';}
document.getElementById('t-ku').addEventListener('click',function(){setLang('ku');});
document.getElementById('t-ar').addEventListener('click',function(){setLang('ar');});
inp.addEventListener('input',function(){nm.textContent=inp.value;});
bg.src=IMG.ku;apply();
document.getElementById('dl').addEventListener('click',async function(){
  try{
    var c=document.createElement('canvas');c.width=1116;c.height=1600;
    var x=c.getContext('2d');x.drawImage(bg,0,0,c.width,c.height);
    x.fillStyle='#fff';x.direction='rtl';x.textAlign='right';x.textBaseline='alphabetic';
    x.font='700 30px "Noto Sans Arabic",Tahoma,Arial,sans-serif';
    x.fillText(inp.value,CFG[cur].x,462,CFG[cur].width/100*1116);
    var blob=await new Promise(function(r){c.toBlob(r,'image/png');});
    var d=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;
    if(d){await d.save({filename:'invitation-'+cur+'.png',data:blob});}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='invitation-'+cur+'.png';document.body.appendChild(a);a.click();a.remove();}
  }catch(e){console.error(e);}
});
var SHARE_URL='https://claude.ai/artifact/ERJxRwFHYNk77d6eXM1iid';
document.getElementById('wa').addEventListener('click',async function(){
  var text=(cur==='ku'?'بانگهێشتنامە بۆ لوتکەی نیشتمانی سلێمانی بۆ کارسازی 2026':'دعوة لحضور قمة السليمانية الوطنية لريادة الأعمال 2026')+'\n'+SHARE_URL;
  try{
    var c=document.createElement('canvas');c.width=1116;c.height=1600;
    var x=c.getContext('2d');x.drawImage(bg,0,0,c.width,c.height);
    x.fillStyle='#fff';x.direction='rtl';x.textAlign='right';x.textBaseline='alphabetic';
    x.font='700 30px "Noto Sans Arabic",Tahoma,Arial,sans-serif';
    x.fillText(inp.value,CFG[cur].x,462,CFG[cur].width/100*1116);
    var blob=await new Promise(function(r){c.toBlob(r,'image/png');});
    var f=new File([blob],'invitation.png',{type:'image/png'});

});
